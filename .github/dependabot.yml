version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-tooling:
        patterns:
          [
            "eslint*",
            "@typescript-eslint/*",
            "typescript-eslint",
            "prettier",
            "vitest",
            "@vitest/*",
            "vite",
            "@vitejs/*",
            "playwright",
            "@playwright/*",
          ]
      runtime:
        patterns: ["motion", "@dnd-kit/*", "zod", "lucide-react", "clsx"]
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
