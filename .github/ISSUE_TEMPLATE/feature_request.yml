name: Feature request
description: Suggest a module, option or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behaviour, and if relevant sketch the JSON configuration you would expect.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
