<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3b5bdb" />
    <meta property="og:title" content="Nibblearn — Tiny interactions. Real learning." />
    <meta
      property="og:description"
      content="Open-source interactive learning components for React."
    />
    <title>Nibblearn — Tiny interactions. Real learning.</title>
    <meta
      name="description"
      content="Nibblearn — tiny interactions, real learning. An open-source React library of beautiful, accessible, interactive learning modules: flashcards, matching, branching scenarios, simulations and more, driven by JSON or components."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("nibblearn-showcase-theme");
          var dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
